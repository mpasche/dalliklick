<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DalliKlick</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="version.js" defer></script>
    <script src="js/notification.js" defer></script>
    <script src="js/engine.js" defer></script>
    <script src="js/effects.js" defer></script>
    <script src="js/i18n.js" defer></script>
    <script src="js/session.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/pwa.js" defer></script>
</head>
<body>
<main class="app">
    <header class="page-header">
        <h1 class="brand">
            <span class="logo"></span>
            <span>Dalli<strong>Klick</strong></span>
            <span class="hint" id="app-version"></span>
        </h1>
        <div class="header-settings">
            <fieldset class="choice-group choice-group--segmented">
                <label>
                    <input type="radio" name="theme" value="light">
                    <span data-i18n="theme.light">Light</span>
                </label>
                <label>
                    <input type="radio" name="theme" value="dark">
                    <span data-i18n="theme.dark">Dark</span>
                </label>
            </fieldset>
            <fieldset class="choice-group choice-group--segmented">
                <label>
                    <input type="radio" name="language" value="de">
                    <span>DE</span>
                </label>
                <label>
                    <input type="radio" name="language" value="en">
                    <span>EN</span>
                </label>
            </fieldset>
        </div>
    </header>

    <div class="workspace">
        <aside class="game-settings">
            <section class="panel">
                <header class="panel-heading">
                    <h2><span class="step">01</span> <span data-i18n="image.heading">Images</span></h2>
                    <button type="button" class="import-order-toggle" id="import-order-toggle">
                        <span id="import-order-name-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M7 4 V20 M3 16 L7 20 L11 16 M14 5 H21 M14 11 H19 M14 17 H17"/>
                            </svg>
                        </span>
                        <span id="import-order-random-icon" hidden>
                            <svg viewBox="0 0 24 24">
                                <path d="M3 6 H6 L18 18 H21 M17 14 L21 18 L17 22 M3 18 H6 L18 6 H21 M17 2 L21 6 L17 10"/>
                            </svg>
                        </span>
                    </button>
                </header>
                <label class="image-upload" id="image-upload" for="file-input">
                    <strong data-i18n="image-upload.select">Choose images</strong>
                    <span data-i18n="image-upload.drop">or drag and drop them here</span>
                    <input id="file-input" type="file" accept="image/*" multiple>
                </label>
                <p class="hint" data-i18n="image-upload.privacy">Your images stay on your device.</p>
            </section>

            <section class="panel">
                <h2><span class="step">02</span> <span data-i18n="game-mode.heading">Game mode</span></h2>
                <fieldset class="choice-group">
                    <label>
                        <input type="radio" name="game-mode" value="grid" checked>
                        <span data-i18n="game-mode.grid">Grid</span>
                    </label>
                    <label>
                        <input type="radio" name="game-mode" value="effect">
                        <span data-i18n="game-mode.effect">Effect</span>
                    </label>
                </fieldset>
                <p class="hint" id="game-mode-hint">Tiles hide the image and are revealed one by one.</p>
            </section>

            <section class="panel">
                <div id="grid-settings">
                    <h2><span class="step">03</span> <span data-i18n="grid.heading">Grid</span></h2>
                    <div class="grid-size">
                        <label for="rows">
                            <span data-i18n="grid.rows">Rows</span>
                            <select id="rows"></select>
                        </label>
                        <label for="columns">
                            <span data-i18n="grid.columns">Columns</span>
                            <select id="columns"></select>
                        </label>
                    </div>
                    <p class="hint" data-i18n="grid.hint">Changing the grid hides the image again.</p>
                    <fieldset class="choice-group">
                        <label>
                            <input type="radio" name="grid-mode" value="manual" checked>
                            <span data-i18n="grid-mode.manual">Manual</span>
                        </label>
                        <label>
                            <input type="radio" name="grid-mode" value="random">
                            <span data-i18n="grid-mode.random">Random</span>
                        </label>
                    </fieldset>
                    <p class="hint" id="grid-mode-hint">Click a tile to reveal it.</p>
                </div>
                <div id="effect-settings" hidden>
                    <h2><span class="step">03</span> <label for="effect" data-i18n="effect.heading">Effect</label></h2>
                    <select id="effect">
                        <option value="blur" data-i18n="effect.blur">Blur</option>
                        <option value="distort" data-i18n="effect.distort">Distort</option>
                        <option value="zoom" data-i18n="effect.zoom">Zoom</option>
                        <option value="swirl" data-i18n="effect.swirl">Swirl</option>
                    </select>
                    <label class="range-label" for="effect-steps">
                        <span data-i18n="effect.steps">Steps</span>
                        <output id="effect-steps-text" for="effect-steps">50</output>
                    </label>
                    <input id="effect-steps" type="range">
                </div>
                <div class="automatic-settings" id="automatic-settings" hidden>
                    <label class="range-label" for="interval">
                        <span id="interval-name">One tile every</span>
                        <output id="interval-text" for="interval">1 second</output>
                    </label>
                    <input id="interval" type="range" min="1">
                </div>
            </section>
        </aside>

        <section class="game-panel">
            <div class="notification" id="notification">
                <p class="message" id="message"></p>
            </div>
            <div class="empty-board" id="empty-board">
                <div class="logo"></div>
                <h2 data-i18n="image-upload.select">Choose images</h2>
                <p class="hint" data-i18n="image-upload.privacy">Your images stay on your device.</p>
            </div>
            <div class="board-area" id="board-area" hidden>
                <div class="board-frame" id="board-frame">
                    <div class="column-labels" id="column-labels"></div>
                    <div class="row-labels" id="row-labels"></div>
                    <div class="board" id="board">
                        <img id="image" draggable="false" alt="Your uploaded image">
                        <canvas id="swirl-canvas"></canvas>
                        <div class="tiles" id="tiles"></div>
                    </div>
                </div>
            </div>
            <nav class="image-navigation" id="image-navigation" hidden>
                <button class="button" id="previous-button" data-i18n="button.previous" disabled>Previous</button>
                <span id="image-position"></span>
                <button class="button" id="next-button" data-i18n="button.next" disabled>Next</button>
            </nav>
        </section>
        <section class="panel game-controls">
            <header class="panel-heading">
                <h2>
                    <svg class="step play-icon" viewBox="0 0 24 24">
                        <path d="M6 3 V21 L21 12 Z"/>
                    </svg>
                    <span data-i18n="game-controls.heading">Game controls</span>
                </h2>
                <button type="button" class="progress-toggle" id="progress-toggle" hidden></button>
            </header>
            <button class="button primary" id="play-button" disabled hidden>Start</button>
            <div class="game-controls-actions">
                <button class="button" id="reveal-button" data-i18n="button.reveal" disabled>Reveal</button>
                <button class="button" id="reset-button" data-i18n="button.reset" disabled>Reset</button>
            </div>
        </section>
    </div>
</main>

<!-- Filter for the "distort" effect: noise moves the pixels; app.js sets the strength (scale). -->
<svg
        class="filters"
        width="0"
        height="0"
>
    <filter id="distort">
        <feTurbulence
                type="fractalNoise"
                baseFrequency="0.04"
                numOctaves="3"
                result="noise"
        />
        <feDisplacementMap
                id="distort-map"
                in="SourceGraphic"
                in2="noise"
                scale="0"
                xChannelSelector="R"
                yChannelSelector="G"
        />
    </filter>
</svg>
</body>
</html>
